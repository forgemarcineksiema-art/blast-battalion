<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blast Battalion</title>
<meta name="description" content="Destructible-terrain run-and-gun: blast through jungle, desert and arctic bases, free prisoners and swap between 12 action heroes.">
<style>
  :root {
    --bg: #0c0b10;
    --ink: #f1eefc;
    --brass: #ffd23a;
    --panel: #26233a;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body {
    color: var(--ink);
    font: 700 14px/1.4 ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #wrap {
    position: fixed;
    top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
    overflow: hidden; background: var(--bg);
  }
  #game {
    position: absolute; left: 0; top: 0;
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none; outline: none;
  }
  #boot {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--brass); letter-spacing: 0.3em; text-transform: uppercase;
  }
  #rotate {
    position: absolute; inset: 0; z-index: 5; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding-inline: 16px; background: var(--bg); color: var(--brass);
    text-align: center; text-transform: uppercase; letter-spacing: 0.1em;
  }
  #rotate .phone {
    width: 30px; height: 52px; border: 4px solid var(--brass); border-radius: 6px;
    animation: turn 1.8s ease-in-out infinite;
  }
  #rotate small { color: var(--ink); opacity: 0.7; font-size: 12px; letter-spacing: 0.05em; }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" tabindex="0" aria-label="Blast Battalion game screen"></canvas>
  <div id="boot">Loading</div>
  <div id="rotate">
    <div class="phone"></div>
    <div>Rotate your device</div>
    <small>Blast Battalion plays in landscape</small>
  </div>
</div>
<script>window.GAME_PLATFORM = window.GAME_PLATFORM || 'none';</script>
